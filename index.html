<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raver Chat</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      background: #f2f5f8;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }
    .theirs {
      background: #e6f2d8;
      color: #222;
      float: left;
      text-align: left;
    }
    .meta {
      font-size: 12px;
      font-weight: 600;
    }
    .timestamp {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }
    #typingIndicator {
      font-size: 14px;
      font-style: italic;
      color: #777;
      margin: 5px 0 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card shadow chat-container">
    <div class="card-body">
      <h2 class="text-center mb-3">💬 Raver Chat</h2>

      <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Enter your name">
      </div>

      <div class="mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span>Your Peer ID: <strong id="my-id">Loading...</strong></span>
        <div class="d-flex gap-2">
          <button class="btn btn-warning" onclick="copyId()"><i class="fas fa-copy"></i></button>
          <button class="btn btn-danger" onclick="confirmAction('reset')"><i class="fas fa-refresh"></i></button>
        </div>
      </div>

      <div class="mb-3 d-flex gap-2 flex-wrap">
        <input type="text" id="peer-id" class="form-control" placeholder="Enter friend's Peer ID">
        <button class="btn btn-success" onclick="connect()"><i class="fas fa-link"></i></button>
      </div>

      <div id="chat"></div>
      <div id="typingIndicator"></div>

      <div class="input-group mb-3">
        <input type="text" id="message" class="form-control" placeholder="Type a message...">
        <button class="btn btn-primary" onclick="send()"><i class="fas fa-paper-plane"></i></button>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button class="btn btn-secondary" onclick="document.getElementById('imageInput').click();"><i class="fas fa-image"></i></button>
      </div>

      <div class="d-flex justify-content-between flex-wrap gap-2">
        <button class="btn btn-outline-danger w-100" onclick="confirmAction('clear')">🗑️ Clear Chat</button>
        <button class="btn btn-outline-info w-100" onclick="showHowTo()">❓ How to Use</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
  <div id="toast" class="toast align-items-center text-white bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">Connected successfully!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>

let conn;
let typingTimeout;
let reconnectInterval;
const chatElem = document.getElementById('chat');
const myIdElem = document.getElementById('my-id');
const username = () => document.getElementById('username').value.trim() || 'You';
const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
const lastConnectedPeer = localStorage.getItem('lastConnectedPeer');

messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

peer.on('open', id => {
  myIdElem.textContent = id;
  localStorage.setItem('peerId', id);

  // Try auto reconnect
  if (lastConnectedPeer && !conn) {
    tryAutoReconnect();
  }
});

peer.on('connection', connection => {
  conn = connection;
  setupConnection();
});

function connect() {
  const friendId = document.getElementById('peer-id').value.trim();
  if (!friendId) return;
  conn = peer.connect(friendId);
  conn.on('open', () => {
    localStorage.setItem('lastConnectedPeer', friendId);
    setupConnection();
    showToast("Connected to " + friendId);
  });
}

function tryAutoReconnect() {
  reconnectInterval = setInterval(() => {
    if (!conn && lastConnectedPeer) {
      conn = peer.connect(lastConnectedPeer);
      conn.on('open', () => {
        setupConnection();
        showToast("Auto-reconnected to " + lastConnectedPeer);
        clearInterval(reconnectInterval);
      });
    }
  }, 3000);
}

function setupConnection() {
  conn.on('data', data => {
    if (data.typing) return showTyping();

    if (data.ack && data.id) {
      updateMessageStatus(data.id, data.ack);
      return;
    }

    const msg = {
      id: data.id || Date.now().toString(),
      user: data.user,
      text: data.text,
      time: new Date().toLocaleTimeString(),
      mine: false,
      isImage: data.isImage || false
    };

    // Send back delivery ack
    conn.send({ ack: 'delivered', id: msg.id });

    // Show & save
    saveMessage(msg);
    showMessage(msg, 'theirs');

    // Send seen after 2 seconds
    setTimeout(() => {
      conn.send({ ack: 'seen', id: msg.id });
    }, 2000);
  });

  showMessage({
    user: 'System',
    text: '✅ Connected!',
    time: new Date().toLocaleTimeString(),
    mine: false
  }, 'theirs');
}

function send() {
  const input = document.getElementById('message');
  const text = input.value.trim();
  if (!text || !conn) return;

  const msg = {
    id: Date.now().toString(),
    user: username(),
    text,
    time: new Date().toLocaleTimeString(),
    mine: true,
    isImage: false,
    status: 'sent'
  };

  conn.send({ id: msg.id, user: msg.user, text: msg.text });
  saveMessage(msg);
  showMessage(msg, 'mine');
  input.value = '';
}

function updateMessageStatus(id, status) {
  const el = document.querySelector(`[data-id="${id}"] .status`);
  if (el) {
    el.textContent =
      status === 'delivered' ? '✓✓' :
      status === 'seen' ? '👁' : '✓';
  }

  // Optional: update status in localStorage
  const i = messages.findIndex(m => m.id === id);
  if (i !== -1) {
    messages[i].status = status;
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }
}

function showMessage(msg, type, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (msg.id) div.dataset.id = msg.id;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = msg.user;

  const content = document.createElement('div');
  if (msg.isImage) {
    const img = document.createElement('img');
    img.src = msg.text;
    content.appendChild(img);
  } else {
    content.textContent = msg.text;
  }

  const time = document.createElement('div');
  time.className = 'timestamp';
  time.innerHTML = `${msg.time} ${msg.mine ? `<span class="status">${msg.status === 'seen' ? '👁' : msg.status === 'delivered' ? '✓✓' : '✓'}</span>` : ''}`;

  div.appendChild(meta);
  div.appendChild(content);
  div.appendChild(time);
  chatElem.appendChild(div);

  if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
}

function saveMessage(msg) {
  messages.push(msg);
  localStorage.setItem('chatHistory', JSON.stringify(messages));
}

// The rest (copyId, showToast, etc.) remains unchanged...

  const peer = new Peer();
  let conn;

  peer.on('open', id => {
    document.getElementById('my-id').innerText = id;
  });

  peer.on('connection', connection => {
    conn = connection;
    setupConnection();
  });

  function connect() {
    const peerId = document.getElementById('peer-id').value;
    conn = peer.connect(peerId);
    setupConnection();
  }

  function setupConnection() {
    conn.on('open', () => showToast());
    conn.on('data', data => {
      if (data.type === 'text') {
        addMessage(data.username, data.text, 'theirs');
      } else if (data.type === 'image') {
        addMessage(data.username, '<img src="' + data.data + '">', 'theirs');
      }
    });
  }

  function send() {
    const text = document.getElementById('message').value;
    const username = document.getElementById('username').value || 'Anonymous';
    if (!conn || !conn.open || !text.trim()) return;
    conn.send({ type: 'text', username, text });
    addMessage(username, text, 'mine');
    document.getElementById('message').value = '';
  }

  function addMessage(user, content, cls) {
    const el = document.createElement('div');
    el.className = `msg ${cls}`;
    el.innerHTML = `<div class="meta">${user}</div><div>${content}</div><div class="timestamp">${new Date().toLocaleTimeString()}</div>`;
    document.getElementById('chat').appendChild(el);
    document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  }

  document.getElementById('imageInput').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file || !conn || !conn.open) return;
    const reader = new FileReader();
    reader.onload = () => {
      const data = reader.result;
      const username = document.getElementById('username').value || 'Anonymous';
      conn.send({ type: 'image', username, data });
      addMessage(username, `<img src="${data}">`, 'mine');
    };
    reader.readAsDataURL(file);
  });

  function showToast() {
    const toast = new bootstrap.Toast(document.getElementById('toast'));
    toast.show();
  }

  function copyId() {
    navigator.clipboard.writeText(document.getElementById('my-id').innerText)
      .then(() => alert('ID copied!'));
  }

  function confirmAction(action) {
    if (confirm(`Are you sure you want to ${action} chat?`)) {
      if (action === 'clear') document.getElementById('chat').innerHTML = '';
      if (action === 'reset') location.reload();
    }
  }

  function showHowTo() {
    alert(`How to use:
1. Enter your name.
2. Share your Peer ID.
3. Enter a friend's Peer ID and connect.
4. Start chatting and share images!`);
  }
</script>
</body>
</html>
