<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raver Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: #f2f5f8;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.6rem;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }
    .theirs {
      background: #e6f2d8;
      color: #222;
      float: left;
      text-align: left;
    }
    .meta {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .timestamp {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
    }
    input[type="text"] {
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #0056b3;
    }
    .danger {
      background: #dc3545;
    }
    .danger:hover {
      background: #b52d3b;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .row input, .row button {
      flex: 1;
      min-width: 100px;
    }
    #my-id-wrap {
      margin-bottom: 10px;
    }
    #typingIndicator {
      font-size: 14px;
      font-style: italic;
      color: #777;
      margin: 5px 0 10px;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 320px;
    }
    @media screen and (max-width: 480px) {
      h2 { font-size: 1.2rem; }
      #chat { height: 320px; }
    }
  </style>
</head>
<body>

<h2><i class="fas fa-comment-dots"></i> Raver Chat</h2>

<div id="username-wrap">
  <input type="text" id="username" placeholder="Enter your name">
</div>

<div id="my-id-wrap">
  <p id="my-id-text">Your Peer ID: <strong id="my-id">Loading...</strong></p>
  <div class="row">
    <button onclick="copyId()"><i class="fas fa-copy"></i></button>
    <button class="danger" onclick="confirmAction('reset')"><i class="fas fa-sync-alt"></i></button>
  </div>
</div>

<div class="row">
  <input type="text" id="peer-id" placeholder="Enter friend's Peer ID">
  <button class="success" onclick="connect()"><i class="fas fa-link"></i></button>
</div>

<div id="chat"></div>
<div id="typingIndicator"></div>

<div class="input-group mb-2">
  <input type="text" id="message" class="form-control" placeholder="Type a message (emojis too 😄)">
  <button onclick="send()" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
  <button onclick="sendImage()" class="btn btn-secondary"><i class="fas fa-image"></i></button>
</div>

<input type="file" id="imageInput" accept="image/*" style="display: none;">

<button class="danger w-100" onclick="confirmAction('clear')"><i class="fas fa-trash-alt"></i> Clear Chat</button>
<button class="w-100 mt-1" onclick="showHowTo()"><i class="fas fa-circle-question"></i> How to Use</button>

<!-- Modals -->
<div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 999;">
  <div class="modal-content">
    <p id="confirmText">Are you sure?</p>
    <div class="d-flex gap-2 justify-content-center mt-3">
      <button onclick="executeConfirmedAction()">Yes</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="howToModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 999;">
  <div class="modal-content">
    <h3><i class="fas fa-tools"></i> How to Use</h3>
    <p>1. Enter your name.</p>
    <p>2. Share your Peer ID with a friend.</p>
    <p>3. Enter your friend's Peer ID and click <i class="fas fa-link"></i>.</p>
    <p>4. Start chatting, sending photos and emojis!</p>
    <button onclick="closeHowTo()">Close</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
  const savedId = localStorage.getItem('peerId');
  const peer = new Peer(savedId || undefined);
  let conn;
  let pendingAction = null;
  let typingTimeout;

  const myIdElem = document.getElementById('my-id');
  const chatElem = document.getElementById('chat');
  const typingIndicator = document.getElementById('typingIndicator');
  const username = () => document.getElementById('username').value.trim() || 'You';

  const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
  messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

  peer.on('open', id => {
    myIdElem.textContent = id;
    localStorage.setItem('peerId', id);
  });

  peer.on('connection', connection => {
    conn = connection;
    setupConnection();
  });

  function connect() {
    const friendId = document.getElementById('peer-id').value;
    conn = peer.connect(friendId);
    conn.on('open', setupConnection);
  }

  function setupConnection() {
    conn.on('data', data => {
      if (data.typing) return showTyping();
      const msg = {
        user: data.user,
        text: data.text,
        time: new Date().toLocaleTimeString(),
        mine: false,
        isImage: data.isImage || false
      };
      saveMessage(msg);
      showMessage(msg, 'theirs');
    });
    showMessage({
      user: 'System',
      text: '✅ Connected!',
      time: new Date().toLocaleTimeString(),
      mine: false
    }, 'theirs');
  }

  function send() {
    const input = document.getElementById('message');
    const msgText = input.value.trim();
    if (!msgText || !conn) return;
    const msg = {
      user: username(),
      text: msgText,
      time: new Date().toLocaleTimeString(),
      mine: true,
      isImage: false
    };
    conn.send({ user: msg.user, text: msg.text });
    saveMessage(msg);
    showMessage(msg, 'mine');
    input.value = '';
  }

  function sendImage() {
    const input = document.getElementById('imageInput');
    input.click();
    input.onchange = function () {
      const file = input.files[0];
      if (!file || !conn) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const msg = {
          user: username(),
          text: e.target.result,
          time: new Date().toLocaleTimeString(),
          mine: true,
          isImage: true
        };
        conn.send({ user: msg.user, text: msg.text, isImage: true });
        saveMessage(msg);
        showMessage(msg, 'mine');
        input.value = '';
      };
      reader.readAsDataURL(file);
    };
  }

  document.getElementById('message').addEventListener('input', () => {
    if (conn) conn.send({ typing: true });
  });

  function showTyping() {
    typingIndicator.textContent = "Your friend is typing...";
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => typingIndicator.textContent = '', 3000);
  }

  function showMessage(msg, type, scroll = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = msg.user;

    const content = document.createElement('div');
    if (msg.isImage) {
      const img = document.createElement('img');
      img.src = msg.text;
      content.appendChild(img);
    } else {
      content.textContent = msg.text;
    }

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = msg.time;

    div.appendChild(meta);
    div.appendChild(content);
    div.appendChild(time);
    chatElem.appendChild(div);

    if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
  }

  function saveMessage(msg) {
    messages.push(msg);
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }

  function confirmAction(action) {
    pendingAction = action;
    const text = {
      reset: "Reset your Peer ID and reload?",
      clear: "Delete all chat history?"
    };
    document.getElementById('confirmText').textContent = text[action];
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    pendingAction = null;
    document.getElementById('confirmModal').style.display = 'none';
  }

  function executeConfirmedAction() {
    if (pendingAction === 'reset') {
      localStorage.removeItem('peerId');
      location.reload();
    } else if (pendingAction === 'clear') {
      localStorage.removeItem('chatHistory');
      chatElem.innerHTML = '';
    }
    closeModal();
  }

  function showHowTo() {
    document.getElementById('howToModal').style.display = 'flex';
  }

  function closeHowTo() {
    document.getElementById('howToModal').style.display = 'none';
  }

  function copyId() {
    const id = document.getElementById('my-id').textContent;
    navigator.clipboard.writeText(id).then(() => {
      const button = document.querySelector('#my-id-wrap button');
      const originalHTML = button.innerHTML;
      button.innerHTML = '<i class="fas fa-check"></i>';
      setTimeout(() => button.innerHTML = originalHTML, 1500);
    });
  }
</script>

</body>
</html>
