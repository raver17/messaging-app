<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Chat (Emoji + Photo)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 550px; margin: auto; background: #f9f9f9; }
    h2 { text-align: center; }

    #chat {
      border: 1px solid #ccc;
      padding: 10px;
      height: 340px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: white;
      border-radius: 6px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 18px;
      clear: both;
      word-wrap: break-word;
      position: relative;
    }

    .mine {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }

    .theirs {
      background: #e2f7d5;
      color: #333;
      float: left;
      text-align: left;
    }

    .meta {
      font-size: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .timestamp {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.6;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .danger {
      background-color: #dc3545;
    }

    .danger:hover {
      background-color: #b52d3b;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 5px;
    }

    #username-wrap {
      margin-bottom: 10px;
    }

    #my-id-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #my-id-text {
      flex-grow: 1;
    }

    /* Modal Styles */
    #confirmModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      max-width: 300px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;
    }
  </style>
</head>
<body>

<h2>💬 PeerJS Chat</h2>

<div id="username-wrap">
  <input type="text" id="username" placeholder="Enter your name">
</div>

<div id="my-id-wrap">
  <p id="my-id-text">Your Peer ID: <strong id="my-id">Loading...</strong></p>
  <button onclick="confirmAction('reset')">Reset ID</button>
</div>

<input type="text" id="peer-id" placeholder="Enter friend's Peer ID to connect">
<button onclick="connect()">Connect</button>

<div id="chat"></div>

<input type="text" id="message" placeholder="Type your message (emoji too 😎)...">
<button onclick="send()">Send</button>

<input type="file" id="imageInput" accept="image/*">
<button onclick="sendImage()">Send Photo</button>

<button class="danger" onclick="confirmAction('clear')">🗑️ Clear Chat History</button>

<!-- Confirmation Modal -->
<div id="confirmModal">
  <div class="modal-content">
    <p id="confirmText">Are you sure?</p>
    <div class="modal-buttons">
      <button onclick="executeConfirmedAction()">Yes</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
  const savedId = localStorage.getItem('peerId');
  const peer = new Peer(savedId || undefined);
  let conn;
  let pendingAction = null;

  const myIdElem = document.getElementById('my-id');
  const chatElem = document.getElementById('chat');
  const username = () => document.getElementById('username').value.trim() || 'You';

  const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
  messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

  peer.on('open', id => {
    myIdElem.textContent = id;
    localStorage.setItem('peerId', id);
  });

  peer.on('connection', connection => {
    conn = connection;
    setupConnection();
  });

  function connect() {
    const friendId = document.getElementById('peer-id').value;
    conn = peer.connect(friendId);
    conn.on('open', setupConnection);
  }

  function setupConnection() {
    conn.on('data', data => {
      const msg = {
        user: data.user,
        text: data.text,
        time: new Date().toLocaleTimeString(),
        mine: false,
        isImage: data.isImage || false
      };
      saveMessage(msg);
      showMessage(msg, 'theirs');
    });

    const welcome = {
      user: 'System',
      text: '✅ Connected!',
      time: new Date().toLocaleTimeString(),
      mine: false
    };
    saveMessage(welcome);
    showMessage(welcome, 'theirs');
  }

  function send() {
    const input = document.getElementById('message');
    const msgText = input.value.trim();
    if (!msgText || !conn) return;

    const msg = {
      user: username(),
      text: msgText,
      time: new Date().toLocaleTimeString(),
      mine: true,
      isImage: false
    };

    conn.send({ user: msg.user, text: msg.text });
    saveMessage(msg);
    showMessage(msg, 'mine');
    input.value = '';
  }

  function sendImage() {
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];
    if (!file || !conn) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const imgData = e.target.result;
      const msg = {
        user: username(),
        text: imgData,
        time: new Date().toLocaleTimeString(),
        mine: true,
        isImage: true
      };

      conn.send({ user: msg.user, text: msg.text, isImage: true });
      saveMessage(msg);
      showMessage(msg, 'mine');
      fileInput.value = '';
    };
    reader.readAsDataURL(file);
  }

  function showMessage(msg, type, scroll = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = msg.user;

    const content = document.createElement('div');
    if (msg.isImage) {
      const img = document.createElement('img');
      img.src = msg.text;
      content.appendChild(img);
    } else {
      content.textContent = msg.text;
    }

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = msg.time;

    div.appendChild(meta);
    div.appendChild(content);
    div.appendChild(time);
    chatElem.appendChild(div);

    if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
  }

  function saveMessage(msg) {
    messages.push(msg);
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }

  // 🔐 Modal Logic
  function confirmAction(action) {
    pendingAction = action;
    const text = {
      reset: "Are you sure you want to reset your Peer ID? This will reload the page.",
      clear: "Are you sure you want to delete all chat history?"
    };
    document.getElementById('confirmText').textContent = text[action];
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    pendingAction = null;
    document.getElementById('confirmModal').style.display = 'none';
  }

  function executeConfirmedAction() {
    if (pendingAction === 'reset') {
      localStorage.removeItem('peerId');
      location.reload();
    } else if (pendingAction === 'clear') {
      localStorage.removeItem('chatHistory');
      chatElem.innerHTML = '';
    }
    closeModal();
  }
</script>

</body>
</html>
