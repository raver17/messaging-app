<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raver Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: #f2f5f8;
      color: #333;
    }
    .card {
      padding: 20px;
      border-radius: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine { background: #007bff; color: white; float: right; text-align: right; }
    .theirs { background: #e6f2d8; color: #222; float: left; text-align: left; }
    .meta { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .timestamp { font-size: 10px; margin-top: 4px; opacity: 0.6; }
    input[type="text"], input[type="file"], button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      border-radius: 6px;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover { background: #0056b3; }
    .danger { background: #dc3545; }
    .danger:hover { background: #b52d3b; }
    #errorMessage {
      display: none;
      margin: 10px 0;
      padding: 10px;
      background-color: #f8d7da;
      color: #721c24;
      border-radius: 5px;
    }
    .connect-button {
      background-color: green;
      color: white;
    }
    .copy-button {
      background-color: yellow;
      color: black;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 class="text-center">💬 Raver Chat</h2>
  
  <div id="errorMessage" class="alert alert-danger" style="display: none;">
    <strong>Error!</strong> Message failed to send.
  </div>

  <div id="username-wrap">
    <input type="text" id="username" placeholder="Enter your name">
  </div>

  <div id="my-id-wrap">
    <p>Your Peer ID: <strong id="my-id">Loading...</strong></p>
    <button onclick="confirmAction('reset')">Reset ID</button>
    <button class="copy-button" onclick="copyId()">Copy ID</button>
  </div>

  <div class="row">
    <input type="text" id="peer-id" placeholder="Enter friend's Peer ID">
    <button onclick="connect()" class="btn connect-button">Connect</button>
  </div>

  <div id="chat"></div>
  <div id="typingIndicator"></div>

  <input type="text" id="message" placeholder="Type a message">
  <button onclick="send()">Send</button>
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="sendImage()">Send Photo</button>
  <button class="danger" onclick="confirmAction('clear')">🗑️ Clear Chat History</button>
</div>

<!-- Modal for confirming actions -->
<div id="confirmModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; background-color: white; border: 1px solid #ccc; border-radius: 8px; width: 300px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
  <p id="confirmText">Are you sure?</p>
  <button onclick="executeConfirmedAction()" class="btn btn-danger">Yes</button>
  <button onclick="closeModal()" class="btn btn-secondary">No</button>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
// Your existing JavaScript code

const savedId = localStorage.getItem('peerId');
const peer = new Peer(savedId || undefined);
let conn;
let pendingAction = null;
let typingTimeout;

const myIdElem = document.getElementById('my-id');
const chatElem = document.getElementById('chat');
const typingIndicator = document.getElementById('typingIndicator');
const username = () => document.getElementById('username').value.trim() || 'You';

const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

peer.on('open', id => {
  myIdElem.textContent = id;
  localStorage.setItem('peerId', id);
});

peer.on('connection', connection => {
  conn = connection;
  setupConnection();
});

function connect() {
  const friendId = document.getElementById('peer-id').value;
  conn = peer.connect(friendId);
  conn.on('open', setupConnection);
}

function setupConnection() {
  conn.on('data', data => {
    if (data.typing) return showTyping();

    const msg = {
      user: data.user,
      text: data.text,
      time: new Date().toLocaleTimeString(),
      mine: false,
      isImage: data.isImage || false
    };
    saveMessage(msg);
    showMessage(msg, 'theirs');
  });

  showMessage({
    user: 'System',
    text: '✅ Connected!',
    time: new Date().toLocaleTimeString(),
    mine: false
  }, 'theirs');
}

function send() {
  const input = document.getElementById('message');
  const msgText = input.value.trim();
  if (!msgText || !conn) return;

  const msg = {
    user: username(),
    text: msgText,
    time: new Date().toLocaleTimeString(),
    mine: true,
    isImage: false
  };

  try {
    conn.send({ user: msg.user, text: msg.text });
    saveMessage(msg);
    showMessage(msg, 'mine');
    input.value = '';
    
    // Hide any previous error messages
    document.getElementById('errorMessage').style.display = 'none';
  } catch (error) {
    console.error("Message send failed:", error);
    // Show the error message
    document.getElementById('errorMessage').style.display = 'block';
    
    // Hide the error after 3 seconds
    setTimeout(() => {
      document.getElementById('errorMessage').style.display = 'none';
    }, 3000);
  }
}

function sendImage() {
  const fileInput = document.getElementById('imageInput');
  const file = fileInput.files[0];
  if (!file || !conn) return;

  const reader = new FileReader();
  reader.onload = function (e) {
    const msg = {
      user: username(),
      text: e.target.result,
      time: new Date().toLocaleTimeString(),
      mine: true,
      isImage: true
    };
    conn.send({ user: msg.user, text: msg.text, isImage: true });
    saveMessage(msg);
    showMessage(msg, 'mine');
    fileInput.value = '';
  };
  reader.readAsDataURL(file);
}

document.getElementById('message').addEventListener('input', () => {
  if (conn) conn.send({ typing: true });
});

function showTyping() {
  typingIndicator.textContent = "Your friend is typing...";
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => typingIndicator.textContent = '', 3000);
}

function showMessage(msg, type, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = msg.user;

  const content = document.createElement('div');
  if (msg.isImage) {
    const img = document.createElement('img');
    img.src = msg.text;
    content.appendChild(img);
  } else {
    content.textContent = msg.text;
  }

  const time = document.createElement('div');
  time.className = 'timestamp';
  time.textContent = msg.time;

  div.appendChild(meta);
  div.appendChild(content);
  div.appendChild(time);
  chatElem.appendChild(div);

  if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
}

function saveMessage(msg) {
  messages.push(msg);
  localStorage.setItem('chatHistory', JSON.stringify(messages));
}

// Confirm Modals
function confirmAction(action) {
  pendingAction = action;
  const text = {
    reset: "Reset your Peer ID and reload?",
    clear: "Delete all chat history?"
  };
  document.getElementById('confirmText').textContent = text[action];
  document.getElementById('confirmModal').style.display = 'block';
}

function closeModal() {
  pendingAction = null;
  document.getElementById('confirmModal').style.display = 'none';
}

function executeConfirmedAction() {
  if (pendingAction === 'reset') {
    localStorage.removeItem('peerId');
    location.reload();
  } else if (pendingAction === 'clear') {
    localStorage.removeItem('chatHistory');
    messages.length = 0;
    chatElem.innerHTML = '';
  }
  closeModal();
}

// Copy ID to clipboard
function copyId() {
  const copyText = document.getElementById('my-id');
  const range = document.createRange();
  range.selectNode(copyText);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);
  document.execCommand('copy');
}
</script>

</body>
</html>
