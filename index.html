<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raver Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: #f2f5f8;
      color: #333;
    }
    .card {
      padding: 20px;
      border-radius: 10px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine { background: #007bff; color: white; float: right; text-align: right; }
    .theirs { background: #e6f2d8; color: #222; float: left; text-align: left; }
    .meta { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .timestamp { font-size: 10px; margin-top: 4px; opacity: 0.6; }
    input[type="text"], input[type="file"], button {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      border-radius: 6px;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover { background: #0056b3; }
    .danger { background: #dc3545; }
    .danger:hover { background: #b52d3b; }
    #errorMessage {
      display: none;
      margin: 10px 0;
      padding: 10px;
      background-color: #f8d7da;
      color: #721c24;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2 class="text-center">💬 Raver Chat</h2>
  
  <div id="errorMessage" class="alert alert-danger" style="display: none;">
    <strong>Error!</strong> Message failed to send.
  </div>

  <div id="username-wrap">
    <input type="text" id="username" placeholder="Enter your name">
  </div>

  <div id="my-id-wrap">
    <p>Your Peer ID: <strong id="my-id">Loading...</strong></p>
    <button onclick="confirmAction('reset')">Reset ID</button>
  </div>

  <div class="row">
    <input type="text" id="peer-id" placeholder="Enter friend's Peer ID">
    <button onclick="connect()" class="btn btn-success">Connect</button>
  </div>

  <div id="chat"></div>
  <div id="typingIndicator"></div>

  <input type="text" id="message" placeholder="Type a message">
  <button onclick="send()">Send</button>
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="sendImage()">Send Photo</button>
  <button class="danger" onclick="confirmAction('clear')">🗑️ Clear Chat History</button>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
// Your existing JavaScript code

function send() {
  const input = document.getElementById('message');
  const msgText = input.value.trim();
  if (!msgText || !conn) return;

  const msg = {
    user: username(),
    text: msgText,
    time: new Date().toLocaleTimeString(),
    mine: true,
    isImage: false
  };

  try {
    conn.send({ user: msg.user, text: msg.text });
    saveMessage(msg);
    showMessage(msg, 'mine');
    input.value = '';
    
    // Hide any previous error messages
    document.getElementById('errorMessage').style.display = 'none';
  } catch (error) {
    console.error("Message send failed:", error);
    // Show the error message
    document.getElementById('errorMessage').style.display = 'block';
    
    // Hide the error after 3 seconds
    setTimeout(() => {
      document.getElementById('errorMessage').style.display = 'none';
    }, 3000);
  }
}
</script>

</body>
</html>
