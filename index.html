<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Raver Chat</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      background: #f2f5f8;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }
    .theirs {
      background: #e6f2d8;
      color: #222;
      float: left;
      text-align: left;
    }
    .meta {
      font-size: 12px;
      font-weight: 600;
    }
    .timestamp {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }
    #typingIndicator {
      font-size: 14px;
      font-style: italic;
      color: #777;
      margin: 5px 0 10px;
    }
    .status {
      font-size: 12px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card shadow chat-container">
    <div class="card-body">
      <h2 class="text-center mb-3">💬 Raver Chat</h2>

      <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Enter your name">
      </div>

      <div class="mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
        <span>Your Peer ID: <strong id="my-id">Loading...</strong></span>
        <div class="d-flex gap-2">
          <button class="btn btn-warning" onclick="copyId()"><i class="fas fa-copy"></i></button>
          <button class="btn btn-danger" onclick="confirmAction('reset')"><i class="fas fa-refresh"></i></button>
        </div>
      </div>

      <div class="mb-3 d-flex gap-2 flex-wrap">
        <input type="text" id="peer-id" class="form-control" placeholder="Enter friend's Peer ID">
        <button class="btn btn-success" onclick="connect()"><i class="fas fa-link"></i></button>
      </div>

      <div id="chat"></div>
      <div id="typingIndicator"></div>

      <div class="input-group mb-3">
        <input type="text" id="message" class="form-control" placeholder="Type a message...">
        <button class="btn btn-primary" onclick="send()"><i class="fas fa-paper-plane"></i></button>
        <input type="file" id="imageInput" accept="image/*" hidden>
        <button class="btn btn-secondary" onclick="document.getElementById('imageInput').click();"><i class="fas fa-image"></i></button>
      </div>

      <div class="d-flex justify-content-between flex-wrap gap-2">
        <button class="btn btn-outline-danger w-100" onclick="confirmAction('clear')">🗑️ Clear Chat</button>
        <button class="btn btn-outline-info w-100" onclick="showHowTo()">❓ How to Use</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
  <div id="toast" class="toast align-items-center text-white bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">Connected successfully!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
let conn;
let typingTimeout;
let reconnectInterval;
const chatElem = document.getElementById('chat');
const myIdElem = document.getElementById('my-id');
const username = () => document.getElementById('username').value.trim() || 'You';
const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
const lastConnectedPeer = localStorage.getItem('lastConnectedPeer');

messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

const peer = new Peer(localStorage.getItem('peerId') || undefined);

peer.on('open', id => {
  myIdElem.textContent = id;
  localStorage.setItem('peerId', id);
  if (lastConnectedPeer && !conn) tryAutoReconnect();
});

peer.on('connection', connection => {
  conn = connection;
  setupConnection();
});

function connect() {
  const friendId = document.getElementById('peer-id').value.trim();
  if (!friendId) return;
  conn = peer.connect(friendId);
  conn.on('open', () => {
    localStorage.setItem('lastConnectedPeer', friendId);
    setupConnection();
    showToast("Connected to " + friendId);
  });
}

function tryAutoReconnect() {
  reconnectInterval = setInterval(() => {
    if (!conn && lastConnectedPeer) {
      conn = peer.connect(lastConnectedPeer);
      conn.on('open', () => {
        setupConnection();
        showToast("Auto-reconnected to " + lastConnectedPeer);
        clearInterval(reconnectInterval);
      });
    }
  }, 3000);
}

function setupConnection() {
  conn.on('data', data => {
    if (data.typing) return showTyping();
    if (data.ack && data.id) return updateMessageStatus(data.id, data.ack);

    const msg = {
      id: data.id || Date.now().toString(),
      user: data.user,
      text: data.text,
      time: new Date().toLocaleTimeString(),
      mine: false,
      isImage: data.isImage || false
    };

    conn.send({ ack: 'delivered', id: msg.id });
    saveMessage(msg);
    showMessage(msg, 'theirs');
    setTimeout(() => conn.send({ ack: 'seen', id: msg.id }), 2000);
  });

  showMessage({ user: 'System', text: '✅ Connected!', time: new Date().toLocaleTimeString(), mine: false }, 'theirs');
}

function send() {
  const input = document.getElementById('message');
  const text = input.value.trim();
  if (!text || !conn) return;

  const msg = {
    id: Date.now().toString(),
    user: username(),
    text,
    time: new Date().toLocaleTimeString(),
    mine: true,
    isImage: false,
    status: 'sent'
  };

  conn.send({ id: msg.id, user: msg.user, text: msg.text });
  saveMessage(msg);
  showMessage(msg, 'mine');
  input.value = '';
}

function updateMessageStatus(id, status) {
  const el = document.querySelector(`[data-id="${id}"] .status`);
  if (el) el.textContent = status === 'seen' ? '👁' : status === 'delivered' ? '✓✓' : '✓';
  const i = messages.findIndex(m => m.id === id);
  if (i !== -1) {
    messages[i].status = status;
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }
}

function showMessage(msg, type, scroll = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  if (msg.id) div.dataset.id = msg.id;

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = msg.user;

  const content = document.createElement('div');
  msg.isImage ? content.appendChild(Object.assign(document.createElement('img'), { src: msg.text })) : content.textContent = msg.text;

  const time = document.createElement('div');
  time.className = 'timestamp';
  time.innerHTML = `${msg.time} ${msg.mine ? `<span class="status">${msg.status === 'seen' ? '👁' : msg.status === 'delivered' ? '✓✓' : '✓'}</span>` : ''}`;

  div.appendChild(meta);
  div.appendChild(content);
  div.appendChild(time);
  chatElem.appendChild(div);
  if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
}

function saveMessage(msg) {
  messages.push(msg);
  localStorage.setItem('chatHistory', JSON.stringify(messages));
}

function showTyping() {
  const typingIndicator = document.getElementById('typingIndicator');
  typingIndicator.textContent = "Your friend is typing...";
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => typingIndicator.textContent = '', 3000);
}

function confirmAction(action) {
  if (action === 'reset') {
    if (confirm("Reset your Peer ID and reload?")) {
      localStorage.removeItem('peerId');
      location.reload();
    }
  } else if (action === 'clear') {
    if (confirm("Clear all chat history?")) {
      localStorage.removeItem('chatHistory');
      chatElem.innerHTML = '';
    }
  }
}

function showToast(message) {
  const toastEl = document.getElementById('toast');
  toastEl.querySelector('.toast-body').textContent = message;
  new bootstrap.Toast(toastEl).show();
}

function copyId() {
  const id = myIdElem.textContent;
  navigator.clipboard.writeText(id).then(() => showToast("Copied your Peer ID!"));
}

document.getElementById('message').addEventListener('input', () => {
  if (conn) conn.send({ typing: true });
});

// Confirm before refresh
window.addEventListener("beforeunload", function (e) {
  e.preventDefault();
  e.returnValue = "Are you sure you want to leave?";
});

document.getElementById('imageInput').addEventListener('change', function () {
  const file = this.files[0];
  if (!file || !conn) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const msg = {
      id: Date.now().toString(),
      user: username(),
      text: e.target.result,
      time: new Date().toLocaleTimeString(),
      mine: true,
      isImage: true,
      status: 'sent'
    };
    conn.send({ id: msg.id, user: msg.user, text: msg.text, isImage: true });
    saveMessage(msg);
    showMessage(msg, 'mine');
  };
  reader.readAsDataURL(file);
});

function showHowTo() {
  alert("1. Enter your name\n2. Share your Peer ID\n3. Enter friend's Peer ID\n4. Start chatting!");
}
</script>
</body>
</html>
