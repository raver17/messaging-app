<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeerJS Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background: #f2f5f8;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.6rem;
    }
    #chat {
      border: 1px solid #ddd;
      padding: 12px;
      height: 360px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 10px;
    }
    .msg {
      display: inline-block;
      max-width: 80%;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 18px;
      word-wrap: break-word;
      clear: both;
      position: relative;
      line-height: 1.4;
    }
    .mine {
      background: #007bff;
      color: white;
      float: right;
      text-align: right;
    }
    .theirs {
      background: #e6f2d8;
      color: #222;
      float: left;
      text-align: left;
    }
    .meta {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .timestamp {
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
    }
    input[type="text"], input[type="file"] {
      padding: 10px;
      margin: 6px 0;
      width: 100%;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px;
      margin: 6px 0;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button:hover {
      background: #0056b3;
    }
    .danger {
      background: #dc3545;
    }
    .danger:hover {
      background: #b52d3b;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .row input, .row button {
      flex: 1;
      min-width: 100px;
    }
    #my-id-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    #my-id-text {
      flex: 1;
    }
    #typingIndicator {
      font-size: 14px;
      font-style: italic;
      color: #777;
      margin: 5px 0 10px;
    }
    /* Modal */
    #confirmModal, #howToModal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 320px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-buttons button {
      flex: 1;
    }
    @media screen and (max-width: 480px) {
      h2 { font-size: 1.2rem; }
      #chat { height: 320px; }
    }
  </style>
</head>
<body>

<h2>💬 Raver Chat</h2>

<div id="username-wrap">
  <input type="text" id="username" placeholder="Enter your name">
</div>

<div id="my-id-wrap">
  <p id="my-id-text">Your Peer ID: <strong id="my-id">Loading...</strong></p>
  <button onclick="confirmAction('reset')">Reset ID</button>
</div>

<div class="row">
  <input type="text" id="peer-id" placeholder="Enter friend's Peer ID">
  <button onclick="connect()">Connect</button>
</div>

<div id="status" style="text-align: center; margin-top: 10px; font-weight: bold;">Disconnected</div>

<div id="chat"></div>
<div id="typingIndicator"></div>

<input type="text" id="message" placeholder="Type a message (emojis too 😄)">
<input type="file" id="imageInput" accept="image/*">
<button onclick="send()">
  <img src="https://img.icons8.com/ios-filled/50/ffffff/paper-plane.png" alt="Send" width="24" height="24">
</button>

<button class="danger" onclick="confirmAction('clear')">🗑️ Clear Chat History</button>
<button onclick="showHowTo()">❓ How to Use</button>

<!-- Modals -->
<div id="confirmModal">
  <div class="modal-content">
    <p id="confirmText">Are you sure?</p>
    <div class="modal-buttons">
      <button onclick="executeConfirmedAction()">Yes</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="howToModal">
  <div class="modal-content">
    <h3>🔧 How to Use</h3>
    <p>1. Enter your name.</p>
    <p>2. Share your Peer ID with a friend.</p>
    <p>3. Enter your friend's Peer ID and click "Connect".</p>
    <p>4. Start chatting, sending photos and emojis!</p>
    <button onclick="closeHowTo()">Close</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
  const savedId = localStorage.getItem('peerId');
  const peer = new Peer(savedId || undefined);
  let conn;
  let pendingAction = null;
  let typingTimeout;

  const myIdElem = document.getElementById('my-id');
  const chatElem = document.getElementById('chat');
  const typingIndicator = document.getElementById('typingIndicator');
  const statusElem = document.getElementById('status');
  const username = () => document.getElementById('username').value.trim() || 'You';

  const messages = JSON.parse(localStorage.getItem('chatHistory') || '[]');
  messages.forEach(msg => showMessage(msg, msg.mine ? 'mine' : 'theirs', false));

  peer.on('open', id => {
    myIdElem.textContent = id;
    localStorage.setItem('peerId', id);
  });

  peer.on('connection', connection => {
    conn = connection;
    setupConnection();
  });

  function connect() {
    const friendId = document.getElementById('peer-id').value;
    conn = peer.connect(friendId);
    conn.on('open', setupConnection);
  }

  function setupConnection() {
    statusElem.textContent = "✅ Connected to " + conn.peer;

    conn.on('data', data => {
      if (data.typing) return showTyping();

      const msg = {
        user: data.user,
        text: data.text,
        time: new Date().toLocaleTimeString(),
        mine: false,
        isImage: data.isImage || false
      };
      saveMessage(msg);
      showMessage(msg, 'theirs');
    });

    showMessage({
      user: 'System',
      text: '✅ Connected!',
      time: new Date().toLocaleTimeString(),
      mine: false
    }, 'theirs');
  }

  function send() {
    const input = document.getElementById('message');
    const fileInput = document.getElementById('imageInput');
    const msgText = input.value.trim();
    const file = fileInput.files[0];
    if ((msgText || file) && conn) {
      let msg = {
        user: username(),
        time: new Date().toLocaleTimeString(),
        mine: true,
        isImage: false
      };

      if (msgText) {
        msg.text = msgText;
      } else if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          msg.text = e.target.result;
          msg.isImage = true;
          conn.send({ user: msg.user, text: msg.text, isImage: true });
          saveMessage(msg);
          showMessage(msg, 'mine');
        };
        reader.readAsDataURL(file);
        fileInput.value = ''; // clear file input after sending
      }

      if (msgText && !file) {
        conn.send({ user: msg.user, text: msg.text });
        saveMessage(msg);
        showMessage(msg, 'mine');
        input.value = '';
      }
    }
  }

  document.getElementById('message').addEventListener('input', () => {
    if (conn) conn.send({ typing: true });
  });

  function showTyping() {
    typingIndicator.textContent = "Your friend is typing...";
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => typingIndicator.textContent = '', 3000);
  }

  function showMessage(msg, type, scroll = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = msg.user;

    const content = document.createElement('div');
    if (msg.isImage) {
      const img = document.createElement('img');
      img.src = msg.text;
      content.appendChild(img);
    } else {
      content.textContent = msg.text;
    }

    const time = document.createElement('div');
    time.className = 'timestamp';
    time.textContent = msg.time;

    div.appendChild(meta);
    div.appendChild(content);
    div.appendChild(time);
    chatElem.appendChild(div);

    if (scroll) chatElem.scrollTop = chatElem.scrollHeight;
  }

  function saveMessage(msg) {
    messages.push(msg);
    localStorage.setItem('chatHistory', JSON.stringify(messages));
  }

  // Confirm Modals
  function confirmAction(action) {
    pendingAction = action;
    const text = {
      reset: "Reset your Peer ID and reload?",
      clear: "Delete all chat history?"
    };
    document.getElementById('confirmText').textContent = text[action];
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function closeModal() {
    pendingAction = null;
    document.getElementById('confirmModal').style.display = 'none';
  }

  function executeConfirmedAction() {
    if (pendingAction === 'reset') {
      localStorage.removeItem('peerId');
      location.reload();
    } else if (pendingAction === 'clear') {
      localStorage.removeItem('chatHistory');
      chatElem.innerHTML = '';
    }
    closeModal();
  }

  // How-to Modal
  function showHowTo() {
    document.getElementById('howToModal').style.display = 'flex';
  }

  function closeHowTo() {
    document.getElementById('howToModal').style.display = 'none';
  }
</script>

</body>
</html>
